name: Build ytdlp-interface

on:
  push:
    branches: [ feat/github-token-auth, main ]
  workflow_dispatch:
    branches: [ '*' ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract dependencies
      shell: pwsh
      run: |
        $deps = "ytdlp-interface dependencies.7z"
        if (Test-Path $deps) {
          # Extract to repo root - deps expect to be at ..\ relative to ytdlp-interface\
          7z x $deps "-o$PWD" -y
          Write-Host "=== Top-level directories ==="
          Get-ChildItem -Directory | ForEach-Object { Write-Host $_.Name }
          Write-Host "=== bit7z check ==="
          Get-ChildItem -Path "bit7z" -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== nana check ==="
          Get-ChildItem -Path "nana\build\bin" -Filter "*.lib" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Error "Dependencies archive not found: $deps"
          exit 1
        }

    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build Release x64
      shell: pwsh
      run: |
        cd ytdlp-interface
        msbuild ytdlp-interface.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ytdlp-interface-x64
        path: ytdlp-interface/x64/Release/ytdlp-interface.exe
        if-no-files-found: error
