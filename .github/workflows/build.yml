name: Build ytdlp-interface

on:
  push:
    branches: [ feat/github-token-auth, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract dependencies
      shell: pwsh
      run: |
        $deps = "ytdlp-interface dependencies.7z"
        if (Test-Path $deps) {
          7z x $deps "-o$PWD" -y
          Write-Host "Dependencies extracted"
        } else {
          Write-Error "Dependencies archive not found"
          exit 1
        }

    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build bit7z
      shell: pwsh
      run: |
        cd bit7z
        mkdir build -Force | Out-Null
        cd build
        cmake .. -A x64
        cmake --build . --config Release
        Write-Host "bit7z built. Libs:"
        Get-ChildItem -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }

    - name: Build nana
      shell: pwsh
      run: |
        cd nana
        mkdir build -Force | Out-Null
        cd build
        cmake .. -A x64
        cmake --build . --config Release
        Write-Host "nana built. Libs:"
        Get-ChildItem -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }

    - name: Build libpng
      shell: pwsh
      run: |
        cd libpng
        # Check if pre-built or needs cmake
        $libFiles = Get-ChildItem -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue
        if ($libFiles) {
          Write-Host "Pre-built libpng found:"
          $libFiles | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "Building libpng from source..."
          mkdir build -Force | Out-Null
          cd build
          cmake .. -A x64
          cmake --build . --config Release
        }

    - name: Build libjpeg-turbo
      shell: pwsh
      run: |
        cd libjpeg-turbo-3.1.2
        $libFiles = Get-ChildItem -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue
        if ($libFiles) {
          Write-Host "Pre-built libjpeg-turbo found:"
          $libFiles | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "Building libjpeg-turbo from source..."
          mkdir build -Force | Out-Null
          cd build
          cmake .. -A x64
          cmake --build . --config Release
        }

    - name: Stage library paths
      shell: pwsh
      run: |
        # nana: copy to expected location and name
        $nanaLibDir = "nana\build\bin"
        New-Item -ItemType Directory -Force -Path $nanaLibDir | Out-Null
        $nanaLib = Get-ChildItem -Path "nana" -Recurse -Filter "nana*.lib" | Select-Object -First 1
        if ($nanaLib) {
          Copy-Item $nanaLib.FullName "$nanaLibDir\nana_v143_Release_x64.lib"
          Write-Host "Staged nana: $nanaLibDir\nana_v143_Release_x64.lib"
        }

        # List all .lib files for debugging
        Write-Host "=== All .lib files ==="
        Get-ChildItem -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }

    - name: Build ytdlp-interface
      shell: pwsh
      run: |
        cd ytdlp-interface
        msbuild ytdlp-interface.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: ytdlp-interface-x64
        path: |
          ytdlp-interface/x64/Release/ytdlp-interface.exe
        if-no-files-found: warn
