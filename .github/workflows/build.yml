name: Build ytdlp-interface

on:
  push:
    branches: [ feat/github-token-auth, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract dependencies
      shell: pwsh
      run: |
        $deps = "ytdlp-interface dependencies.7z"
        if (Test-Path $deps) {
          7z x $deps "-o$PWD" -y
          Write-Host "Dependencies extracted"
          # List structure
          Get-ChildItem -Directory | ForEach-Object { Write-Host "DIR: $($_.Name)" }
          Write-Host "=== bit7z contents ==="
          Get-ChildItem -Path "bit7z" -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== nana contents ==="
          Get-ChildItem -Path "nana" -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== libpng contents ==="
          Get-ChildItem -Path "libpng" -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== libjpeg-turbo contents ==="
          Get-ChildItem -Path "libjpeg-turbo-3.1.2" -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Error "Dependencies archive not found"
          exit 1
        }

    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build dependencies and main project
      shell: pwsh
      run: |
        # Build bit7z x64
        Write-Host "=== Building bit7z ==="
        cd bit7z
        if (Test-Path "CMakeLists.txt") {
          mkdir build -Force | Out-Null
          cd build
          cmake .. -A x64 -DBIT7Z_BUILD_SHARED=OFF -DBIT7Z_BUILD_TESTS=OFF
          cmake --build . --config Release
          cmake --install . --prefix "../bin"
        } elseif (Test-Path "bit7z.sln") {
          msbuild bit7z.sln /p:Configuration=Release /p:Platform=x64 /m
        } else {
          Write-Host "Checking for pre-built libs..."
          Get-ChildItem -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
        }
        cd $env:GITHUB_WORKSPACE

        # Build nana
        Write-Host "=== Building nana ==="
        cd nana
        if (Test-Path "CMakeLists.txt") {
          mkdir build -Force | Out-Null
          cd build
          cmake .. -A x64 -DNANA_CMAKE_STD_STRING_VIEW=ON -DNANA_CMAKE_STD_MAKE_UNIQUE=ON -DNANA_CMAKE_STD_OPTIONAL=ON
          cmake --build . --config Release
        } elseif (Test-Path "build\ytdlp-interface.sln") {
          msbuild build\ytdlp-interface.sln /p:Configuration=Release /p:Platform=x64 /m
        } else {
          Get-ChildItem -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
        }
        cd $env:GITHUB_WORKSPACE

        # Build main project
        Write-Host "=== Building ytdlp-interface ==="
        cd ytdlp-interface
        msbuild ytdlp-interface.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: ytdlp-interface-x64
        path: |
          ytdlp-interface/x64/Release/ytdlp-interface.exe
          ytdlp-interface/Release/x64/ytdlp-interface.exe
        if-no-files-found: warn
